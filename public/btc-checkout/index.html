<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/interaction-restrictions.js"></script>
<title>Checkout integrado — Bitdeer BTC</title>
<style>
:root {
  color-scheme: dark;
  --page-bg: #0b1016;
  --panel: #151f2a;
  --border: #2b3a47;
  --text: #f4f7f8;
  --muted: #a4b1bc;
  --amber: #f4b942;
  --cyan: #54c8d5;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: clamp(18px, 5vw, 48px);
  color: var(--text);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 12% 0%, rgb(84 200 213 / .12), transparent 38%),
    radial-gradient(ellipse at 90% 100%, rgb(244 185 66 / .08), transparent 36%),
    var(--page-bg);
}
.card {
  position: relative;
  width: min(100%, 620px);
  overflow: hidden;
  padding: clamp(24px, 5vw, 48px);
  background: linear-gradient(145deg, rgb(255 255 255 / .035), transparent 48%), var(--panel);
  border: 1px solid var(--border);
  border-radius: 28px;
  box-shadow: 0 24px 70px rgb(0 0 0 / .34);
}
.card::before {
  position: absolute;
  inset: 0 0 auto;
  height: 2px;
  content: "";
  background: linear-gradient(90deg, transparent, var(--amber), var(--cyan), transparent);
}
h1 {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 18px;
  font-size: clamp(1.35rem, 4vw, 1.8rem);
  line-height: 1.2;
  letter-spacing: -.025em;
}
h1::before {
  display: grid;
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  place-items: center;
  content: "₿";
  color: var(--amber);
  font-size: 1.45rem;
  border: 1px solid rgb(244 185 66 / .45);
  border-radius: 14px;
  background: rgb(244 185 66 / .1);
  box-shadow: 0 0 24px rgb(244 185 66 / .12);
}
p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: clamp(.9rem, 2.2vw, 1rem);
}
p:last-child { margin: 22px 0 0; }
a {
  display: inline-flex;
  min-height: 46px;
  align-items: center;
  justify-content: center;
  padding: 10px 18px;
  color: #211806;
  font-weight: 800;
  text-decoration: none;
  border: 1px solid rgb(255 222 153 / .72);
  border-radius: 13px;
  background: linear-gradient(118deg, #ffd36b, var(--amber));
  box-shadow: 0 9px 24px rgb(169 110 12 / .22);
  transition: filter 180ms ease, box-shadow 180ms ease, transform 180ms ease;
}
a:hover { filter: brightness(1.06); box-shadow: 0 12px 28px rgb(169 110 12 / .3); }
a:active { transform: translateY(1px) scale(.97); filter: brightness(.88); }
a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
@media (max-width: 480px) {
  .card { border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  a:active { transform: none; }
}
</style></head>
<body><main class="card"><h1>Checkout atualizado</h1>
<p>Esta página de checkout independente foi desativada para evitar divergências de preços e pedidos sem autenticação.</p>
<p>Para consultar os planos atuais, gerar um pedido com cotação verificada e acompanhar a aprovação, entre na sua conta.</p>
<p><a href="/">Voltar ao aplicativo Bitdeer BTC</a></p>
</main></body></html>
