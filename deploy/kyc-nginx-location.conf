# Add these directives inside the existing exact location = /api/index.php.
# The smaller limit for every other route remains unchanged.
client_max_body_size 18m;
fastcgi_param PHP_VALUE "upload_max_filesize=8M \n post_max_size=18M \n max_file_uploads=2 \n max_execution_time=60";
fastcgi_param BITDEER_KYC_KEY_FILE /etc/bitdeer-btc/kyc.key;
